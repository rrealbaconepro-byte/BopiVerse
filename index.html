<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BopiVerse</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(180deg,#8ecbff,#dff4ff);
  color:#123;
}
.glass{
  background:rgba(255,255,255,.25);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.4);
  border-radius:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.1);
}
#auth{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.box{width:100%;max-width:430px;padding:24px}
input,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.7);
}
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:12px;
  background:#2f7df6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
header{
  position:sticky;
  top:0;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav button{
  width:auto;
  margin:2px;
  padding:10px 14px;
}
.page{
  display:none;
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.active{display:block}
.chat{
  height:300px;
  overflow:auto;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.2);
}
.post{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,.3);
}
.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}
.community{
  padding:14px;
  margin:10px 0;
  border-radius:16px;
  background:rgba(255,255,255,.18);
}
</style>
</head>
<body>

<section id="auth">
  <div class="box glass">
    <h1>🌍 BopiVerse</h1>
    <p>Create your account</p>

    <input id="name" placeholder="Bopi Name">
    <input id="email" placeholder="Email (optional)">
    <input id="pass" type="password" placeholder="Password">
    <input id="confirm" type="password" placeholder="Confirm Password">

    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>

    <p id="msg"></p>
  </div>
</section>

<section id="app" style="display:none">

<header class="glass">
  <h2>🌍 BopiVerse</h2>
  <nav>
    <button onclick="openPage('home')">Home</button>
    <button onclick="openPage('communities')">Communities</button>
    <button onclick="openPage('chat')">Chat</button>
    <button onclick="openPage('voice')">Voice</button>
    <button onclick="openPage('profile')">Profile</button>
  </nav>
</header>

<div id="home" class="page active">
  <div class="glass" style="padding:18px">
    <h2>🎮 Game Feed</h2>
    <textarea id="postText" placeholder="Share the games you love..."></textarea>
    <input type="file" id="postImg" accept="image/*">
    <button onclick="createPost()">Post</button>

    <div id="feed"></div>
  </div>
</div>

<div id="communities" class="page">
  <div class="glass" style="padding:18px">
    <h2>👥 Communities</h2>

    <div class="community">
      <h3>Mario Fans</h3>
      <p>Everything Mario.</p>
    </div>

    <div class="community">
      <h3>Zelda Kingdom</h3>
      <p>Discuss Zelda games.</p>
    </div>

    <div class="community">
      <h3>Pokémon Club</h3>
      <p>Battle & trade.</p>
    </div>
  </div>
</div>

<div id="chat" class="page">
  <div class="glass" style="padding:18px">
    <h2>🌐 Global Chat</h2>

    <div id="chatBox" class="chat">
      <div><b>BopiBot:</b> Welcome!</div>
    </div>

    <input id="chatInput" placeholder="Message everyone...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<div id="voice" class="page">
  <div class="glass" style="padding:18px">
    <h2>🎙 Voice & Camera</h2>

    <div style="height:220px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px">
      📷 Camera Preview
    </div>

    <button>🎤 Mute</button>
    <button>📹 Camera</button>
  </div>
</div>

<div id="profile" class="page">
  <div class="glass" style="padding:18px">
    <h2>👤 Profile</h2>

    <img id="avatar" class="avatar">

    <input type="file" id="avatarFile" accept="image/*" onchange="changeAvatar(event)">
    <input id="displayName" placeholder="Display Name">
    <textarea id="bio" placeholder="Description"></textarea>

    <button onclick="saveProfile()">Save Profile</button>
  </div>
</div>

</section>

<script>
const socket=io();

function signup(){
  if(pass.value!==confirm.value){
    msg.innerText="Passwords do not match";
    return;
  }

  const user={
    name:name.value,
    email:email.value,
    pass:pass.value,
    bio:"",
    avatar:""
  };

  localStorage.setItem("bopi",JSON.stringify(user));
  enter();
}

function login(){
  const u=JSON.parse(localStorage.getItem("bopi"));

  if(!u){
    msg.innerText="No account";
    return;
  }

  if(name.value!==u.name||pass.value!==u.pass){
    msg.innerText="Wrong login";
    return;
  }

  enter();
}

function enter(){
  const u=JSON.parse(localStorage.getItem("bopi"));
  auth.style.display="none";
  app.style.display="block";
  displayName.value=u.name;
  bio.value=u.bio;
  if(u.avatar) avatar.src=u.avatar;
}

function openPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function createPost(){
  const div=document.createElement("div");
  div.className="post";
  div.innerHTML="<h3>"+displayName.value+"</h3><p>"+postText.value+"</p>";

  const file=postImg.files[0];
  if(file){
    const r=new FileReader();
    r.onload=e=>{
      div.innerHTML+=`<img src="${e.target.result}" style="width:100%;border-radius:12px;margin-top:10px">`;
    };
    r.readAsDataURL(file);
  }

  feed.prepend(div);
  postText.value="";
}

function sendMessage(){
  const text=chatInput.value;
  if(!text) return;

  socket.emit("chat",{user:displayName.value,text});
  chatInput.value="";
}

socket.on("chat",m=>{
  chatBox.innerHTML+=`<div><b>${m.user}:</b> ${m.text}</div>`;
  chatBox.scrollTop=chatBox.scrollHeight;
});

function changeAvatar(e){
  const f=e.target.files[0];
  if(!f) return;

  const r=new FileReader();
  r.onload=x=>avatar.src=x.target.result;
  r.readAsDataURL(f);
}

function saveProfile(){
  const u=JSON.parse(localStorage.getItem("bopi"));
  u.name=displayName.value;
  u.bio=bio.value;
  u.avatar=avatar.src;
  localStorage.setItem("bopi",JSON.stringify(u));
  alert("Profile saved");
}
</script>

</body>
</html>
